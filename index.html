<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkinsWheel</title>
  </head>
  <body>
    <main>
      <header>
        <p class="who"><span id="nick"></span><span id="progress"></span></p>
        <h1 id="title"></h1>
      </header>
      <div class="stage">
        <canvas id="wheel" width="1000" height="1000"></canvas>
        <p id="caption" aria-live="polite"></p>
      </div>
      <div class="controls">
        <button id="spin" type="button">Крутити <kbd>Space</kbd></button>
        <button id="again" type="button" class="secondary">Новий лоадаут <kbd>N</kbd></button>
        <button id="open-settings" type="button" class="secondary">Налаштування <kbd>S</kbd></button>
      </div>
      <section id="cards"></section>
      <footer>Симуляція, без виграшів. Не пов'язано з Valve. Код: <span id="code"></span></footer>
    </main>

    <dialog id="settings">
      <form method="dialog" id="settings-form">
        <h2>Що крутимо</h2>
        <div class="presets" id="presets"></div>
        <ol id="slots"></ol>
        <button type="button" id="add-slot" class="secondary">+ Додати слот</button>

        <label class="field">Нік глядача <input id="nick-input" type="text" maxlength="32" autocomplete="off" /></label>
        <label class="check"><input id="fast" type="checkbox" /> Швидкий спін (1.5 с замість 5 с)</label>

        <div class="dialog-actions">
          <button type="submit" value="cancel" class="secondary">Скасувати</button>
          <button type="submit" value="apply" id="apply">Почати</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
